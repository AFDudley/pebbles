status: completed
pebble_id: so-a5d
summary: >
  Fixed pb's three unbuffered event-log readers (internal/pebbles/log.go's
  readEventLog, internal/pebbles/events.go's decodeEvents, and
  cmd/pb/log.go's caller of it) so a well-formed events.jsonl line up to
  5 MiB reads normally instead of failing the whole log at the old 64 KiB
  bufio.Scanner default. Both readers now split the log themselves
  (new internal/pebbles/event_lines.go, shared by both) instead of using a
  fixed-size scanner token, so there is no scan buffer to exceed. A line
  over 5 MiB is named by its 1-based line number and skipped rather than
  failing the read: decodeEvents reports it on stderr since it feeds the
  SQLite cache every pb verb reads, and readEventLog returns it to
  cmd/pb/log.go which prints the same warning for `pb log`. Verified with
  Go unit tests (TestSplitEventLinesReportsOversizedLineByNumber,
  TestSplitEventLinesAcceptsExactlyMaxSize,
  TestReadEventLogSkipsOversizedLineAndReportsIt,
  TestLoadEventsSkipsOversizedLine, plus the pre-existing malformed-line
  tests, all green) and with all five of the spec's real acceptance
  oracles run against the built pb binary, each matching every `then`
  predicate in contracts/specs/derived-so-a5d.spec.json. Confirmed
  red-before-green by running three of the five oracles against base
  commit d45d16c in a detached worktree: they failed there with the exact
  "token too long" text pb printed in production, then passed against
  this branch.
